<table width="100%" cellpadding="0" cellspacing="0" style="font-family:Arial,sans-serif;max-width:600px;margin:auto;">
    <!-- Logo -->
    <tr>
        <td align="center" style="padding:20px;">
            <img src="cid:logo" alt="CURSALA" width="180" style="display:block;margin:auto;" />
        </td>
    </tr>
    
    <!-- Contenido principal -->
    <tr>
        <td style="padding:20px 0 0;">
            <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td>
                        <h2 style="color:#333;font-size:20px;margin:0;">¡Comienza tu curso!</h2>
                        <p style="color:#555;font-size:15px;margin:10px 0 0;">Hola {{user}} 👋</p>
                        <p style="color:#555;font-size:15px;margin:10px 0;">Tu curso <strong>{{course}}</strong> ya ha comenzado. Estamos muy contentos de tenerte.</p>
                    </td>
                    <!-- Imagen lateral -->
                    <td width="40%" valign="top" align="center">
                        <img src="cid:laptop" alt="Imagen" width="300" style="display:block;margin:auto;" />
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    
    <!-- Botón CTA -->
    <tr>
        <td align="left" style="padding:0 0 20px;">
            <a href="https://cursala.com.ar/cursos" style="background:#4F46E5;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;display:inline-block;font-weight:bold;">
                Ir al curso ➜
            </a>
        </td>
    </tr>
    
    <!-- Footer -->
    <tr>
        <td style="padding:20px;font-size:12px;color:#666;border-top:1px solid #ddd;">
            <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td align="left" valign="middle" style="font-size: 12px;color:#666;width:50%;">
                        ¿Necesitás ayuda?
                    </td>
                    <td align="right" valign="middle" style="width: 50%;">
                        <a href="https://www.instagram.com/cursala.online" target="_blank" style="margin:0 5px;display:inline-block;text-decoration:none;">
                            <img src="cid:instagram" alt="Instagram" width="28" style="display:block;" />
                        </a>
                        <a href="https://www.linkedin.com/company/cursala/" target="_blank" style="margin:0 5px;display:inline-block;text-decoration:none;">
                            <img src="cid:linkedin" alt="LinkedIn" width="28" style="display:block;" />
                        </a>
                        <a href="https://youtube.com/@cursalaenvivo" target="_blank" style="margin:0 5px;display:inline-block;text-decoration:none;">
                            <img src="cid:youtube" alt="YouTube" width="28" style="display:block;" />
                        </a>
                        <a href="https://www.facebook.com/share/18h5Kz5uD5/" target="_blank" style="margin:0 5px;display:inline-block;text-decoration:none;">
                            <img src="cid:facebook" alt="Facebook" width="28" style="display:block;" />
                        </a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
